[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    windows: tests requiring Windows platform APIs (Job Objects, Win32 handles)
    posix: tests requiring POSIX platform APIs (setrlimit, killpg, SIGKILL)
    slow: long-running end-to-end or chaos test suites

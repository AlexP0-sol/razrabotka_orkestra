[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "0.1.0"
description = "Autonomous multi-agent software engineering factory with deterministic verification and crypto-trading domain pack"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ORCHESTRA Engineering" }
]
dependencies = [
    "openai>=3.41.0,<4.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.16.2,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "fastapi>=0.162.0,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "aiogram>=3.31.0,<4.0.0",
    "rich>=15.0.0,<16.0.0",
    "typer>=0.27.3,<1.0.0",
    "structlog>=26.1.0,<27.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "tiktoken>=0.14.0,<1.0.0",
    "websockets>=17.4,<18.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3,<1.0.0",
    "mypy>=2.4.1,<3.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "hypothesis>=6.170.14,<7.0.0",
    "respx>=0.23.1,<1.0.0",
    "types-PyYAML>=6.0.12.20261030",
]

[project.scripts]
orchestra = "orchestra.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestra*"]

[tool.setuptools.package-data]
orchestra = [
    "py.typed",
    "prompts/templates/*.md",
    "web/*",
    "web/vendor/*",
]
